name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build RankMySetupScanner/RankMySetupScanner.csproj -c Release -o out

      - name: Upload build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: RankMySetupScanner
          path: out/RankMySetupScanner.exe

